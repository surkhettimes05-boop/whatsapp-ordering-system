services:
  - type: web
    name: whatsapp-ordering-backend
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npx prisma generate && npm prune --omit=dev
    preDeployCommand: npx prisma migrate deploy
    startCommand: node scripts/bootstrap-production.js && node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: whatsapp-keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_SHOP_URL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_GRAPH_VERSION
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_WHATSAPP_APP_SECRET
        sync: false
      - key: META_CATALOG_ID
        sync: false
      - key: CATALOG_FEED_TOKEN
        sync: false
      - key: WHATSAPP_STATUS_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: COMMERCE_WHOLESALER_ID
        value: pasalho-fulfillment
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENABLE_LEGACY_ROUTES
        value: "false"
      - key: ENABLE_PROMOTIONS
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_LAUNCH_CONTROL
        value: true
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: REQUIRE_LIVE_PAYMENTS
        value: "false"
    healthCheckPath: /health/ready
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 10

  - type: keyvalue
    name: whatsapp-keyvalue
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: whatsapp-postgres
    databaseName: whatsapp_ordering
    user: whatsapp_user
    plan: 0.1c-256mb
    ipAllowList: []
