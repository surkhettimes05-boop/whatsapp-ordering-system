name: Backend CI

on:
  push:
    branches:
      - main
      - fix/consolidate-backend-root
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whatsapp_ordering?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Syntax-check backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Load application in test mode
        run: node -e "const app=require('./src/app'); if (!app) process.exit(1); process.exit(0)"

      - name: Verify commerce module surface
        run: node -e "const c=require('./src/services/commerce.service'); const names=['listCatalog','getCart','addCartItem','checkoutCart','getSalesDashboard','getDailyReconciliation']; if(names.some(n=>typeof c[n]!=='function')) process.exit(1); process.exit(0)"
