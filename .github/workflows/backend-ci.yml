name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/consolidate-backend-root
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_ordering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_ordering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whatsapp_ordering?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply full migration chain to empty PostgreSQL
        run: npx prisma migrate deploy

      - name: Confirm migration status
        run: npx prisma migrate status

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax-check backend and ops scripts
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Load application in test mode
        run: node -e "const app=require('./src/app'); if (!app) process.exit(1); process.exit(0)"

      - name: Verify commerce module surface
        run: node -e "const c=require('./src/services/commerce.service'); const names=['listCatalog','getCart','addCartItem','checkoutCart','getSalesDashboard','getDailyReconciliation']; if(names.some(n=>typeof c[n]!=='function')) process.exit(1); process.exit(0)"


      - name: Verify shopping/payment module surface
        run: node -e "const s=require('./src/services/shopping.service'); const p=require('./src/services/payment.service'); const sNames=['quote','checkout','createOffer','setCartCoupon','resolveServiceArea','listAddresses']; const pNames=['initiate','verifyKhalti','verifyEsewaPayload','renderEsewaForm']; if(sNames.some(n=>typeof s[n]!=='function')||pNames.some(n=>typeof p[n]!=='function')) process.exit(1); process.exit(0)"


      - name: Verify Meta commerce module surface
        run: node -e "const m=require('./src/services/metaWhatsApp.service'); const names=['sendList','sendProduct','sendProductList','sendCtaUrl','verifyWebhookSignature','normalizeInbound']; if(names.some(n=>typeof m[n]!=='function')) process.exit(1); process.exit(0)"

      - name: Ensure legacy address router is not mounted
        run: "! grep -q \"routes/address.routes\" src/app.js"

      - name: Validate commerce dashboard JavaScript
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('src/public/commerce-dashboard.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) process.exit(1); new Function(m[1]);"

      - name: Build production Docker image
        run: docker build -t whatsapp-ordering-production .

      - name: Validate production fail-fast configuration
        run: |
          NODE_ENV=production           DATABASE_URL="$DATABASE_URL"           JWT_SECRET="ci-production-secret-0123456789abcdef"           CORS_ORIGIN="https://shop.example.com,https://admin.example.com"           PUBLIC_BASE_URL="https://api.example.com"           PUBLIC_SHOP_URL="https://shop.example.com"           REDIS_URL="redis://example.internal:6379"           WHATSAPP_PROVIDER="meta"           META_GRAPH_VERSION="v26.0"           META_WHATSAPP_PHONE_NUMBER_ID="1234567890"           META_WHATSAPP_ACCESS_TOKEN="ci-meta-access-token"           META_WHATSAPP_VERIFY_TOKEN="ci-meta-verify-token"           META_WHATSAPP_APP_SECRET="ci-meta-app-secret"           META_CATALOG_ID="1234567890"           CATALOG_FEED_TOKEN="ci-catalog-feed-token-0123456789"           UPLOAD_DIR="/var/data/uploads"           REQUIRE_LIVE_PAYMENTS="true"           KHALTI_ENV="production"           KHALTI_SECRET_KEY="ci-khalti-secret"           ESEWA_ENV="production"           ESEWA_PRODUCT_CODE="CI-PRODUCT"           ESEWA_SECRET_KEY="ci-esewa-secret"           node -e "require('./src/config/production-readiness').assertProductionConfiguration(); console.log('production config gate passed')"
