name: Refresh secure lockfile

on:
  push:
    branches:
      - prod/launch-readiness

permissions:
  contents: write

jobs:
  secure-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/launch-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Re-resolve dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --omit=dev
      - name: Require zero high production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh secure dependency lockfile"
          git push origin HEAD:prod/launch-readiness
