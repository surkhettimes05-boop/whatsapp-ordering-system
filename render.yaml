services:
  - type: web
    name: whatsapp-ordering-backend
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: whatsapp-keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_SHOP_URL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_GRAPH_VERSION
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_WHATSAPP_APP_SECRET
        sync: false
      - key: META_CATALOG_ID
        sync: false
      - key: CATALOG_FEED_TOKEN
        sync: false
      - key: PAYMENT_PROVIDER
        value: external
      - key: PAYMENT_CHECKOUT_BASE_URL
        sync: false
      - key: KHALTI_ENV
        value: production
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: ESEWA_ENV
        value: production
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: FORCE_TWILIO_VERIFY
        value: false
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_BIDDING
        value: true
      - key: ENABLE_CREDIT_SYSTEM
        value: true
      - key: ENABLE_LAUNCH_CONTROL
        value: true
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: REQUIRE_LIVE_PAYMENTS
        value: "true"
    healthCheckPath: /health
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: whatsapp-postgres
    databaseName: whatsapp_ordering
    user: whatsapp_user
    plan: starter
